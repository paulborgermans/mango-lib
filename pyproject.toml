[project]
name = "mango-lib"
version = "0.1.1"
description = "Library of utility functions used across ManGO Portal, ManGO Flow and ManGO Ingest amongst others"
readme = "README.md"
authors = [
    { name = "Paul Borgermans", email = "paul.borgermans@kuleuven.be" },
    { name = "Mariana Montes", email = "mariana.montes@kuleuven.be"}
]
requires-python = ">=3.12"
dependencies = [
    "humanize>=4.15.0",
    "jinja2>=3.1.6",
    "mango-mdconverter>=0.0.10",
    "python-irodsclient>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
