[project]
name = "mango-lib"
version = "0.1.0"
description = "Library of utility functions used across ManGO POrtal, ManGO Flow and ManGO Ingest amongst others"
readme = "README.md"
authors = [
    { name = "Paul Borgermans", email = "paul.borgermans@kuleuven.be" },
    { name = "Mariana Montes", email = "mariana.montes@kuleuven.be"}
]
requires-python = ">=3.12"
dependencies = [
    "python-irodsclient>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
